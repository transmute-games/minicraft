  "manifest": {
    "schema-version": "1.16.0",
    "install": {
      "gh": {
        "pkg-path": "gh"
      },
      "git": {
        "pkg-path": "git"
      },
      "markdownlint-cli2": {
        "pkg-path": "markdownlint-cli2"
      },
      "mermaid-cli": {
        "pkg-path": "mermaid-cli"
      },
      "pre-commit": {
        "pkg-path": "pre-commit"
      },
      "temurin-bin-17": {
        "pkg-path": "temurin-bin-17"
      }
    },
    "vars": {
      "MINICRAFT_PORT": "4225"
    },
    "hook": {
      "on-activate": "  cd \"$FLOX_ENV_PROJECT\" || exit 1\n\n  # Ensure Gradle wrapper is executable when checking out on Windows→Unix.\n  if [ -f ./gradlew ] && [ ! -x ./gradlew ]; then\n    chmod +x ./gradlew\n  fi\n\n  # Keep local git hooks wired when pre-commit is available.\n  if command -v pre-commit >/dev/null 2>&1 && [ -f .pre-commit-config.yaml ]; then\n    if [ ! -f .git/hooks/pre-commit ] || ! grep -q 'pre-commit' .git/hooks/pre-commit 2>/dev/null; then\n      pre-commit install >/dev/null 2>&1 || true\n    fi\n  fi\n\n  echo \"minicraft flox env ready — java=$(java -version 2>&1 | head -1)\"\n  echo \"  flox activate -- ./gradlew :client:run\"\n  echo \"  flox activate -- ./gradlew spotlessCheck deadCodeCheck test\"\n"
    },
    "profile": {
      "common": "  alias mc-test='./gradlew spotlessCheck deadCodeCheck test :client:verifyHeadless'\n  alias mc-run='./gradlew :client:run'\n  alias mc-server='./gradlew :server:run --args=\"--port ${MINICRAFT_PORT:-4225}\"'\n  alias mc-fmt='./gradlew spotlessApply'\n  alias mc-docs='markdownlint-cli2 && ./scripts/check-mermaid.sh'\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    }
  },
