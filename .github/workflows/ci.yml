name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Publish transmute-core to mavenLocal
        run: |
          git clone --depth 1 https://github.com/transmute-games/transmute-core.git /tmp/transmute-core
          cd /tmp/transmute-core
          ./gradlew :transmute-core:publishToMavenLocal --no-daemon
      - name: Test
        run: ./gradlew test :client:verifyHeadless --no-daemon
